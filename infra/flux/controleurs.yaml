apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-controleurs
  namespace: collector
rules:
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, ocirepositories, helmrepositories, helmcharts, buckets, externalartifacts,
      gitrepositories/status, ocirepositories/status, helmrepositories/status, helmcharts/status, buckets/status,
      externalartifacts/status, gitrepositories/finalizers, ocirepositories/finalizers, helmrepositories/finalizers,
      helmcharts/finalizers, buckets/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases, helmreleases/status, helmreleases/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-controleurs
  namespace: collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-controleurs
subjects:
  - { kind: ServiceAccount, name: source-controller, namespace: collector }
  - { kind: ServiceAccount, name: helm-controller, namespace: collector }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-controleurs
  namespace: collector
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [source-controller, helm-controller] }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock: { cidr: 0.0.0.0/0, except: [169.254.169.254/32] }
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    - to:
        - podSelector:
            matchLabels: { app: source-controller }
      ports:
        - { protocol: TCP, port: 9090 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: source-controller-artefacts
  namespace: collector
spec:
  podSelector:
    matchLabels: { app: source-controller }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: helm-controller }
      ports:
        - { protocol: TCP, port: 9090 }
