# Configuration du broker du canal (US-011, D05), commune a docker compose, Kubernetes et ECS.
# Montee en remplacement complet de /etc/rabbitmq/conf.d : le 10-defaults.conf de l'image
# (guest joignable depuis le reseau) n'est jamais charge.

listeners.tcp.default = 5672
management.tcp.port = 15672
prometheus.tcp.port = 15692

# guest : jamais cree (definitions importees au demarrage) et, par defense, limite a la boucle locale.
loopback_users.guest = true

# Topologie et droits (versionnes, definitions/10-topologie.json) + utilisateurs et empreintes
# (generes a chaque session, 00-utilisateurs.json), fusionnes depuis le meme repertoire.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions
definitions.skip_if_unchanged = false

# Bornes de ressources (D05) : seuil memoire sous la limite de 1 Gio du conteneur,
# seuil disque compatible avec un stockage ephemere de 2 Gio.
vm_memory_high_watermark.absolute = 600MiB
disk_free_limit.absolute = 256MiB

# Defense en profondeur de la validation stricte (MC6) : 128 Kio par message au plus.
max_message_size = 131072

log.console = true
log.console.level = info
