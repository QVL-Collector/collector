apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sortie-base-migration
  namespace: place-de-marche
spec:
  podSelector:
    matchLabels: { collector/migration: "true" }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 0.0.0.0/0, except: [169.254.169.254/32] }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: base-locale }
      ports:
        - { protocol: TCP, port: 5432 }
