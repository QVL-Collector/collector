# Premier crochet de migration : il s'exécute avant les politiques du chart. Port PostgreSQL seul, IMDS exclue ;
# base-locale : k3d, où un ipBlock ne couvre pas les adresses des pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sortie-base-migration
  namespace: place-de-marche
spec:
  podSelector:
    matchLabels: { collector/migration: "true" }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 0.0.0.0/0, except: [169.254.169.254/32] }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: base-locale }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sortie-base-migration
  namespace: interactions
spec:
  podSelector:
    matchLabels: { collector/migration: "true" }
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 0.0.0.0/0, except: [169.254.169.254/32] }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: base-locale }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
