# Namespaces de l'application (MS4 : un par service) et refus par défaut, appliqués par tools/up-flux.sh avant les
# Secrets et avant Flux : aucun namespace applicatif n'existe sans politique (US-006 AC1). Les flux autorisés viennent
# du chart infra/application ; le canal porte ses propres politiques (infra/canal). front : voir socle.yaml.
# collector : objets Flux (GitRepository, HelmRelease), compte deployeur et versions Helm ; aucune charge.
apiVersion: v1
kind: Namespace
metadata:
  name: collector
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: canal
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
