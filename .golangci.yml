# Configuration commune à tous les modules Go (services/*, libs/*, infra/*) ; appelée par la CI avec --config (D04, D10, D12).
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - gosec
    - exhaustive
    - gocognit
    - errorlint
    - bodyclose
  settings:
    gocognit:
      min-complexity: 15
    exhaustive:
      default-signifies-exhaustive: false
  exclusions:
    generated: strict
    rules:
      # TOTP (RFC 6238) : HMAC-SHA1 imposé par la politique OTP du realm (applications d'authentification) ; test seulement.
      - path: infra/identite/totp_test\.go$
        linters: [gosec]
        text: "G505"

formatters:
  enable:
    - gofmt
