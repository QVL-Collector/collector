# Pipeline de PR et de main (D10, docs/processus/cicd.md).
# Un seul workflow : les jobs concernés sont choisis par le job « changements » ; « ci-ok » est la vérification requise unique.
# Portes de sécurité : journaux publics limités à des compteurs, détail en SARIF dans l'onglet sécurité (MQ5).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: "off"
  GOFLAGS: -mod=readonly
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  NODE_VERSION: "24"
  SARIF_PUBLIABLE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  changements:
    name: Changements
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      modules_go: ${{ steps.filtre.outputs.modules_go }}
      go: ${{ steps.filtre.outputs.go }}
      web: ${{ steps.filtre.outputs.web }}
      outillage: ${{ steps.filtre.outputs.outillage }}
      analyse: ${{ steps.filtre.outputs.analyse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filtrer les chemins modifiés
        id: filtre
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TETE: ${{ github.event.pull_request.head.sha }}
        run: bash tools/ci/changements.sh

  outillage:
    name: Workflows et scripts
    needs: changements
    if: needs.changements.outputs.outillage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker compose -f tools/ci/outils.yml run --rm actionlint -color
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker compose -f tools/ci/outils.yml run --rm zizmor --persona=regular --format=github .github/workflows
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' 'tools/git-hooks/*' | grep -v '^sandbox/')
          docker compose -f tools/ci/outils.yml run --rm shellcheck --severity=warning "${scripts[@]}"

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # publication des rapports SARIF dans l'onglet sécurité
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (diff de la PR, historique complet sinon)
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TETE: ${{ github.event.pull_request.head.sha }}
        run: bash tools/ci/secrets.sh
      - name: Publier le rapport SARIF (gitleaks)
        if: always() && env.SARIF_PUBLIABLE == 'true' && hashFiles('rapports/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: rapports/gitleaks.sarif
          category: gitleaks
      - name: Conserver les compteurs I6
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i6-secrets
          path: rapports/i6-*.json
          retention-days: 90
          if-no-files-found: ignore

  sast:
    name: Analyse statique (Semgrep)
    needs: changements
    if: needs.changements.outputs.analyse == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # publication des rapports SARIF dans l'onglet sécurité
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (règles du projet, sévérité ERROR)
        run: bash tools/ci/semgrep.sh
      - name: Publier le rapport SARIF (Semgrep)
        if: always() && env.SARIF_PUBLIABLE == 'true' && hashFiles('rapports/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: rapports/semgrep.sarif
          category: semgrep
      - name: Conserver les compteurs I6
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i6-sast
          path: rapports/i6-*.json
          retention-days: 90
          if-no-files-found: ignore

  config:
    name: Configuration et dépendances (Trivy)
    needs: changements
    if: needs.changements.outputs.analyse == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # publication des rapports SARIF dans l'onglet sécurité
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restaurer la base Trivy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trivy
          key: trivy-config-${{ github.run_id }}
          restore-keys: trivy-
      - name: Exceptions (.trivyignore datées, 30 jours au plus)
        run: bash tools/ci/verifier-exceptions.sh
      - name: Trivy config (infra/, Dockerfile, manifests, charts)
        if: always()
        run: bash tools/ci/trivy.sh config . config
      - name: Trivy fs (verrou npm du front)
        if: always()
        run: |
          if [[ -f web/package-lock.json ]]; then
            bash tools/ci/trivy.sh fs web web
          else
            echo "Aucun verrou npm : analyse ignorée."
          fi
      - name: Publier le rapport SARIF (Trivy config)
        if: always() && env.SARIF_PUBLIABLE == 'true' && hashFiles('rapports/trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: rapports/trivy-config.sarif
          category: trivy-config
      - name: Publier le rapport SARIF (Trivy fs)
        if: always() && env.SARIF_PUBLIABLE == 'true' && hashFiles('rapports/trivy-web.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: rapports/trivy-web.sarif
          category: trivy-web
      - name: Conserver les compteurs I6
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i6-config
          path: rapports/i6-*.json
          retention-days: 90
          if-no-files-found: ignore

  go:
    name: Go (${{ matrix.module }})
    needs: changements
    if: needs.changements.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # publication des rapports SARIF dans l'onglet sécurité
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changements.outputs.modules_go) }}
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*
      - name: Nommer le module
        id: nom
        run: echo "nom=${MODULE//\//-}" >> "$GITHUB_OUTPUT"
      - name: Vérifier les dépendances
        working-directory: ${{ matrix.module }}
        run: bash "${GITHUB_WORKSPACE}/tools/ci/verifier-modules.sh"
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml
      - name: Tests unitaires (race, couverture)
        working-directory: ${{ matrix.module }}
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=couverture.out ./...
      - name: Publier la couverture (non bloquante au sprint 1)
        working-directory: ${{ matrix.module }}
        run: |
          total="$(go tool cover -func=couverture.out | awk '/^total:/ {print $NF}')"
          echo "Couverture ${MODULE} : ${total:-non mesurée}"
          printf '### Couverture\n\n| Module | Couverture |\n|---|---|\n| %s | %s |\n' "${MODULE}" "${total:-non mesurée}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: couverture-${{ steps.nom.outputs.nom }}
          path: ${{ matrix.module }}/couverture.out
          retention-days: 90
          if-no-files-found: ignore
      - name: govulncheck (vulnérabilités atteignables)
        if: always() && steps.nom.outcome == 'success'
        working-directory: ${{ matrix.module }}
        env:
          NOM: ${{ steps.nom.outputs.nom }}
        run: bash "${GITHUB_WORKSPACE}/tools/ci/govulncheck.sh" "${NOM}"
      - name: Construire l'image sans la pousser
        id: image
        env:
          NOM: ${{ steps.nom.outputs.nom }}
        run: |
          if [[ -f "${MODULE}/Dockerfile" ]]; then
            docker build --file "${MODULE}/Dockerfile" --tag "collector/${NOM}:ci" .
            echo "construite=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun Dockerfile dans ${MODULE} : construction ignorée."
          fi
      - name: Restaurer la base Trivy
        if: steps.image.outputs.construite == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trivy
          key: trivy-${{ steps.nom.outputs.nom }}-${{ github.run_id }}
          restore-keys: trivy-
      - name: Trivy image (critique ou élevée corrigeable, secrets embarqués)
        if: steps.image.outputs.construite == 'true'
        env:
          NOM: ${{ steps.nom.outputs.nom }}
        run: bash tools/ci/trivy.sh image "collector/${NOM}:ci" "${NOM}"
      - name: Publier le rapport SARIF (govulncheck)
        if: always() && env.SARIF_PUBLIABLE == 'true' && hashFiles(format('rapports/govulncheck-{0}.sarif', steps.nom.outputs.nom)) != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: rapports/govulncheck-${{ steps.nom.outputs.nom }}.sarif
          category: govulncheck-${{ steps.nom.outputs.nom }}
      - name: Publier le rapport SARIF (Trivy image)
        if: always() && env.SARIF_PUBLIABLE == 'true' && hashFiles(format('rapports/trivy-{0}.sarif', steps.nom.outputs.nom)) != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: rapports/trivy-${{ steps.nom.outputs.nom }}.sarif
          category: trivy-image-${{ steps.nom.outputs.nom }}
      - name: Conserver les compteurs I6
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i6-go-${{ steps.nom.outputs.nom }}
          path: rapports/i6-*.json
          retention-days: 90
          if-no-files-found: ignore

  web:
    name: Front (web)
    needs: changements
    if: needs.changements.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installer les dépendances (verrou, sans script)
        run: npm ci --ignore-scripts
      - name: Types (tsc -b)
        run: npm run typecheck
      - name: Règles ESLint obligatoires (jsx-a11y, react/no-danger)
        run: bash ../tools/ci/verifier-eslint.sh
      - name: ESLint
        run: npx --no-install eslint . --max-warnings=0
      - name: Parité des traductions FR/EN
        run: npm run i18n:check
      - name: Tests unitaires (Vitest, couverture)
        run: npx --no-install vitest run --coverage.enabled --coverage.reporter=text-summary --coverage.reporter=json-summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: couverture-web
          path: web/coverage/coverage-summary.json
          retention-days: 90
          if-no-files-found: ignore

  securite:
    name: Compteurs de sécurité (I6)
    needs: [secrets, sast, config, go]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: i6-*
          path: i6
          merge-multiple: true
      - name: Agréger les compteurs (aucun identifiant de vulnérabilité publié)
        run: |
          shopt -s nullglob
          fichiers=(i6/*.json)
          if (( ${#fichiers[@]} == 0 )); then
            echo '[]' > i6.json
          else
            jq -s '.' "${fichiers[@]}" > i6.json
          fi
          {
            echo "### Sécurité (I6) : compteurs"
            echo ""
            echo "| Outil | Bloquants | Détail |"
            echo "|---|---|---|"
            jq -r '.[] | "| \(.outil) | \(.bloquants) | \(del(.outil, .bloquants) | tojson) |"' i6.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i6
          path: i6.json
          retention-days: 90

  ci-ok:
    name: ci-ok
    needs: [changements, outillage, secrets, sast, config, go, web]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Agréger les résultats
        env:
          RESULTATS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTATS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' > resultats.txt
          cat resultats.txt
          if grep -Ev ' (success|skipped)$' resultats.txt; then
            echo "::error::au moins un job requis est en échec ou annulé"
            exit 1
          fi
