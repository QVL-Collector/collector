# XP01 session EKS : sondes de G4, G7-1, G7-3, G8. MS3 principal : IMDS joignable (limite de sauts 2),
# filtré par politique réseau ; seul pdm-test (composant autorisé) l'atteint.
apiVersion: v1
kind: Namespace
metadata: { name: pdm-test }
---
apiVersion: v1
kind: Namespace
metadata: { name: controle-test }
---
apiVersion: v1
kind: Namespace
metadata: { name: transactions-test }
---
apiVersion: v1
kind: Namespace
metadata: { name: ns-intrus }
---
apiVersion: v1
kind: Secret
metadata: { name: temoin, namespace: pdm-test }
stringData: { valeur: secret-temoin-xp01 }
---
apiVersion: v1
kind: Secret
metadata: { name: temoin, namespace: ns-intrus }
stringData: { valeur: secret-temoin-intrus }
---
apiVersion: v1
kind: Pod
metadata: { name: reserver, namespace: pdm-test, labels: { app: reserver } }
spec:
  automountServiceAccountToken: false
  containers:
    - name: reserver
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["netexec", "--http-port=8080"]
      ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Pod
metadata: { name: sonde-aws, namespace: pdm-test }
spec:
  automountServiceAccountToken: false
  containers:
    - name: sonde
      image: public.ecr.aws/aws-cli/aws-cli:2.22.35
      command: ["sleep", "7200"]
---
apiVersion: v1
kind: Pod
metadata: { name: sonde-pg, namespace: pdm-test }
spec:
  automountServiceAccountToken: false
  containers:
    - name: sonde
      image: postgres:17-alpine
      command: ["sleep", "7200"]
---
apiVersion: v1
kind: Pod
metadata: { name: sonde-pg, namespace: controle-test }
spec:
  automountServiceAccountToken: false
  containers:
    - name: sonde
      image: postgres:17-alpine
      command: ["sleep", "7200"]
---
apiVersion: v1
kind: Pod
metadata: { name: sonde, namespace: transactions-test }
spec:
  automountServiceAccountToken: false
  containers:
    - name: sonde
      image: curlimages/curl:8.11.1
      command: ["sleep", "7200"]
---
apiVersion: v1
kind: Pod
metadata: { name: sonde, namespace: ns-intrus }
spec:
  automountServiceAccountToken: false
  containers:
    - name: sonde
      image: curlimages/curl:8.11.1
      command: ["sleep", "7200"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: reserver-depuis-transactions, namespace: pdm-test }
spec:
  podSelector: { matchLabels: { app: reserver } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: transactions-test } }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: sortie-sans-imds, namespace: ns-intrus }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 0.0.0.0/0, except: [169.254.169.254/32] } }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: sortie-sans-imds, namespace: transactions-test }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 0.0.0.0/0, except: [169.254.169.254/32] } }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: sortie-sans-imds-ni-vpc, namespace: controle-test }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{ ipBlock: { cidr: 0.0.0.0/0, except: [169.254.169.254/32, 10.40.0.0/16] } }]
