# Broker RabbitMQ : StatefulSet a une replique, emptyDir (D05), Service interne seulement
# (aucun NodePort, aucun LoadBalancer). L'image est remplacee par k3d.sh (versions.env).
# ConfigMap "rabbitmq-config" et Secret "rabbitmq-interne" sont crees par k3d.sh depuis
# broker/ (versionne) et .genere/ (genere a chaque session).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq
  namespace: collector-canal
  labels: { app.kubernetes.io/part-of: xp02 }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: collector-canal
  labels: { app: rabbitmq, app.kubernetes.io/part-of: xp02 }
spec:
  type: ClusterIP
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: gestion, port: 15672, targetPort: 15672 }
    - { name: metriques, port: 15692, targetPort: 15692 }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-noeuds
  namespace: collector-canal
  labels: { app: rabbitmq, app.kubernetes.io/part-of: xp02 }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: rabbitmq }
  ports:
    - { name: epmd, port: 4369, targetPort: 4369 }
    - { name: distribution, port: 25672, targetPort: 25672 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: collector-canal
  labels: { app: rabbitmq, app.kubernetes.io/part-of: xp02 }
spec:
  serviceName: rabbitmq-noeuds
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq, app.kubernetes.io/part-of: xp02 }
    spec:
      serviceAccountName: rabbitmq
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: cookie
          image: RABBITMQ_IMAGE
          command: ["/bin/sh", "-c", "cp /secrets/cookie-erlang /var/lib/rabbitmq/.erlang.cookie && chmod 400 /var/lib/rabbitmq/.erlang.cookie"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: donnees, mountPath: /var/lib/rabbitmq }
            - { name: cookie, mountPath: /secrets, readOnly: true }
      containers:
        - name: rabbitmq
          image: RABBITMQ_IMAGE
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: gestion, containerPort: 15672 }
            - { name: metriques, containerPort: 15692 }
            - { name: epmd, containerPort: 4369 }
            - { name: distribution, containerPort: 25672 }
          env:
            - { name: RABBITMQ_NODENAME, value: rabbit@rabbitmq-0 }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          startupProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            periodSeconds: 5
            timeoutSeconds: 15
            failureThreshold: 36
          readinessProbe:
            exec: { command: ["/bin/sh", "-c", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"] }
            periodSeconds: 10
            timeoutSeconds: 15
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - { name: donnees, mountPath: /var/lib/rabbitmq }
            - { name: tmp, mountPath: /tmp }
            - { name: confd, mountPath: /etc/rabbitmq/conf.d, readOnly: true }
            - { name: plugins, mountPath: /etc/rabbitmq/enabled_plugins, subPath: enabled_plugins, readOnly: true }
            - { name: journaux, mountPath: /var/log/rabbitmq }
            # Montage fichier par fichier (subPath) : un volume projete monte en repertoire expose
            # aussi ses sous-repertoires internes "..<horodatage>", que RabbitMQ tente d'importer
            # (echec eisdir constate sur 4.3.7).
            - { name: topologie, mountPath: /etc/rabbitmq/definitions/10-topologie.json, subPath: 10-topologie.json, readOnly: true }
            - { name: utilisateurs, mountPath: /etc/rabbitmq/definitions/00-utilisateurs.json, subPath: 00-utilisateurs.json, readOnly: true }
      volumes:
        - name: donnees
          emptyDir: { sizeLimit: 2Gi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: confd
          configMap:
            name: rabbitmq-config
            items: [{ key: 10-collector.conf, path: 10-collector.conf }]
        - name: plugins
          configMap:
            name: rabbitmq-config
            items: [{ key: enabled_plugins, path: enabled_plugins }]
        - name: cookie
          secret:
            secretName: rabbitmq-interne
            defaultMode: 0440
            items: [{ key: cookie-erlang, path: cookie-erlang }]
        - name: journaux
          emptyDir: { sizeLimit: 256Mi }
        - name: topologie
          configMap:
            name: rabbitmq-config
            items: [{ key: 10-topologie.json, path: 10-topologie.json }]
        - name: utilisateurs
          secret:
            secretName: rabbitmq-interne
            defaultMode: 0440
            items: [{ key: 00-utilisateurs.json, path: 00-utilisateurs.json }]
