# Namespaces de XP02 sur k3d (Local 2) et EKS. pdm-test, controle-test et ns-intrus sont partages
# avec XP01 : "apply" est idempotent, et k3d.sh down ne supprime que les namespaces propres a XP02.
apiVersion: v1
kind: Namespace
metadata:
  name: collector-canal
  labels:
    app.kubernetes.io/part-of: xp02
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: pdm-test
---
apiVersion: v1
kind: Namespace
metadata:
  name: controle-test
---
apiVersion: v1
kind: Namespace
metadata:
  name: interactions-test
  labels:
    app.kubernetes.io/part-of: xp02
---
apiVersion: v1
kind: Namespace
metadata:
  name: lecture-test
  labels:
    app.kubernetes.io/part-of: xp02
---
apiVersion: v1
kind: Namespace
metadata:
  name: ns-intrus
