# Outils d'analyse de la CI, épinglés par empreinte et mis à jour par Dependabot (écosystème docker-compose).
# Même fichier en CI et sur le poste : docker compose -f tools/ci/outils.yml run --rm <outil> <arguments>
# Le dépôt est monté en lecture seule sous /depot ; les rapports sont écrits dans /rapports (dossier rapports/, ignoré par git).
name: collector-outils

x-depot: &depot
  working_dir: /depot
  volumes:
    - ../..:/depot:ro
    - ../../rapports:/rapports

services:
  actionlint:
    <<: *depot
    image: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  zizmor:
    <<: *depot
    image: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
    environment:
      - GH_TOKEN

  shellcheck:
    <<: *depot
    image: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

  gitleaks:
    <<: *depot
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    environment:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /depot
