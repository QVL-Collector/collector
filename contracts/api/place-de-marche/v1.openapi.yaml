openapi: 3.0.3
info:
  title: Place de marché, API v1
  version: 1.0.0
  description: >-
    API HTTP de la Place de marché. Erreurs au format Problem Details (RFC 9457, application/problem+json),
    sans trace technique. Les routes du catalogue et des catégories sont publiques : elles n'exposent que les
    articles publiés, sans aucune donnée du vendeur, et un article non publié y répond 404 comme un article
    inexistant. Les routes du vendeur exigent un jeton d'accès Keycloak valide (signature RS256,
    émetteur, audience place-de-marche, client autorisé collector-web, type Bearer, expiration) portant le rôle
    de realm vendeur. Un article d'un autre vendeur répond 404, sans révéler son existence. Les routes
    d'administration exigent le même jeton portant le rôle de realm admin ; tout autre rôle répond 403. Corps JSON
    refusés : clé dupliquée (casse ignorée), champ inconnu, type inattendu, valeur racine autre qu'un objet, plus de
    32 Kio.
servers:
  - url: /marche/v1
tags:
  - name: Catégories
  - name: Catalogue
  - name: Vendeur
  - name: Administration
paths:
  /articles:
    get:
      tags: [Catalogue]
      operationId: listerCatalogue
      summary: Articles publiés, du plus récemment publié au plus ancien, filtrables par catégorie
      security: []
      parameters:
        - $ref: "#/components/parameters/Categorie"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Taille"
      responses:
        "200":
          description: Page du catalogue ; une page au-delà du total est vide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageCatalogue"
        "400":
          $ref: "#/components/responses/SaisieInvalide"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /articles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Catalogue]
      operationId: lireArticlePublie
      summary: Fiche d'un article publié
      security: []
      responses:
        "200":
          description: Fiche de l'article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticlePublie"
        "404":
          $ref: "#/components/responses/Introuvable"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /categories:
    get:
      tags: [Catégories]
      operationId: listerCategories
      summary: Catégories proposées à la saisie, source unique des catégories
      security: []
      responses:
        "200":
          description: Catégories, triées par libellé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListeCategories"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /vendeur/articles:
    get:
      tags: [Vendeur]
      operationId: listerMesArticles
      summary: Articles du vendeur connecté, du plus récemment modifié au plus ancien
      security:
        - jetonKeycloak: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Taille"
      responses:
        "200":
          description: Page d'articles du vendeur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageArticles"
        "400":
          $ref: "#/components/responses/SaisieInvalide"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "403":
          $ref: "#/components/responses/NonAutorise"
        "500":
          $ref: "#/components/responses/ErreurInterne"
    post:
      tags: [Vendeur]
      operationId: creerBrouillon
      summary: Créer un brouillon d'article, à l'état brouillon et en révision 1
      security:
        - jetonKeycloak: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreationBrouillon"
      responses:
        "201":
          description: Brouillon créé
          headers:
            Location:
              description: Chemin du brouillon créé
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          $ref: "#/components/responses/SaisieInvalide"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "403":
          $ref: "#/components/responses/NonAutorise"
        "413":
          $ref: "#/components/responses/CorpsTropVolumineux"
        "415":
          $ref: "#/components/responses/TypeNonPrisEnCharge"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /vendeur/articles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Vendeur]
      operationId: lireMonArticle
      summary: Lire un article du vendeur connecté
      security:
        - jetonKeycloak: []
      responses:
        "200":
          description: Article du vendeur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "403":
          $ref: "#/components/responses/NonAutorise"
        "404":
          $ref: "#/components/responses/Introuvable"
        "500":
          $ref: "#/components/responses/ErreurInterne"
    put:
      tags: [Vendeur]
      operationId: modifierBrouillon
      summary: >-
        Remplacer le contenu d'un article ; la révision lue est exigée et augmente de 1. Brouillon ou refusé : l'état
        ne change pas. Publié, en_controle ou a_verifier : l'article passe en_controle, son motif est effacé, il quitte
        le catalogue et la nouvelle révision est soumise au contrôle, quel que soit le champ modifié ; toute issue
        portant sur une révision antérieure est ignorée
      security:
        - jetonKeycloak: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModificationBrouillon"
      responses:
        "200":
          description: Article modifié, dans son nouvel état
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          $ref: "#/components/responses/SaisieInvalide"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "403":
          $ref: "#/components/responses/NonAutorise"
        "404":
          $ref: "#/components/responses/Introuvable"
        "409":
          $ref: "#/components/responses/Conflit"
        "413":
          $ref: "#/components/responses/CorpsTropVolumineux"
        "415":
          $ref: "#/components/responses/TypeNonPrisEnCharge"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /vendeur/articles/{id}/soumission:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Vendeur]
      operationId: soumettreAuControle
      summary: >-
        Soumettre un article brouillon ou refusé au contrôle de publication ; la révision lue est exigée et augmente
        de 1. L'article passe en_controle, son motif est effacé, et l'issue arrive de façon asynchrone : publie,
        refuse ou a_verifier, avec le motif de l'issue, à relire par GET /vendeur/articles/{id}
      security:
        - jetonKeycloak: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Soumission"
      responses:
        "202":
          description: Soumission acceptée, article en_controle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          $ref: "#/components/responses/SaisieInvalide"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "403":
          $ref: "#/components/responses/NonAutorise"
        "404":
          $ref: "#/components/responses/Introuvable"
        "409":
          $ref: "#/components/responses/Conflit"
        "413":
          $ref: "#/components/responses/CorpsTropVolumineux"
        "415":
          $ref: "#/components/responses/TypeNonPrisEnCharge"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /admin/articles:
    get:
      tags: [Administration]
      operationId: listerArticlesAVerifier
      summary: >-
        Articles à l'état a_verifier, du plus anciennement modifié au plus récent, avec le contenu de la révision
        examinée et le motif du contrôle
      security:
        - jetonKeycloak: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Taille"
      responses:
        "200":
          description: Page d'articles à vérifier ; une page au-delà du total est vide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageArticlesAVerifier"
        "400":
          $ref: "#/components/responses/SaisieInvalide"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "403":
          $ref: "#/components/responses/NonAutorise"
        "500":
          $ref: "#/components/responses/ErreurInterne"
  /admin/articles/{id}/decision:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Administration]
      operationId: deciderArticleAVerifier
      summary: >-
        Publier ou refuser un article a_verifier ; la révision examinée est exigée. Publier le fait apparaître au
        catalogue ; refuser exige un motif de la liste fermée, que le vendeur lit ensuite dans motif. La décision est
        journalisée (admin, article, révision, décision, motif).
      security:
        - jetonKeycloak: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decision"
      responses:
        "200":
          description: Décision appliquée, article à l'état publie ou refuse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          $ref: "#/components/responses/SaisieInvalide"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "403":
          $ref: "#/components/responses/NonAutorise"
        "404":
          $ref: "#/components/responses/Introuvable"
        "409":
          $ref: "#/components/responses/ConflitDecision"
        "413":
          $ref: "#/components/responses/CorpsTropVolumineux"
        "415":
          $ref: "#/components/responses/TypeNonPrisEnCharge"
        "422":
          $ref: "#/components/responses/MotifInvalide"
        "500":
          $ref: "#/components/responses/ErreurInterne"
components:
  securitySchemes:
    jetonKeycloak:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Categorie:
      name: categorie
      in: query
      required: false
      description: >-
        Identifiant d'une catégorie de GET /categories ; présent une seule fois et non vide (sinon code invalide),
        catégorie existante (sinon code categorie_inconnue)
      schema:
        type: string
        maxLength: 64
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
    Taille:
      name: taille
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  schemas:
    Montant:
      type: object
      additionalProperties: false
      required: [montantCentimes, devise]
      properties:
        montantCentimes:
          type: integer
          format: int64
          minimum: 0
        devise:
          type: string
          enum: [EUR]
    SaisiePrix:
      type: object
      nullable: true
      additionalProperties: false
      required: [montantCentimes, devise]
      properties:
        montantCentimes:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000
        devise:
          type: string
          enum: [EUR]
    SaisieFraisDePort:
      type: object
      nullable: true
      additionalProperties: false
      required: [montantCentimes, devise]
      properties:
        montantCentimes:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000
        devise:
          type: string
          enum: [EUR]
    SaisieTitre:
      type: string
      maxLength: 200
      description: Sans caractère de contrôle
    SaisieDescription:
      type: string
      maxLength: 5000
      description: Sans caractère de contrôle, sauts de ligne et tabulations admis
    SaisieCategorie:
      type: string
      nullable: true
      maxLength: 64
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      description: Identifiant d'une catégorie de GET /categories
    CreationBrouillon:
      description: >-
        Contenu d'un brouillon. Un champ absent vaut texte vide ou null : la complétude est jugée à la soumission
        au contrôle.
      type: object
      additionalProperties: false
      properties:
        titre:
          $ref: "#/components/schemas/SaisieTitre"
        description:
          $ref: "#/components/schemas/SaisieDescription"
        categorieId:
          $ref: "#/components/schemas/SaisieCategorie"
        prix:
          $ref: "#/components/schemas/SaisiePrix"
        fraisDePort:
          $ref: "#/components/schemas/SaisieFraisDePort"
    ModificationBrouillon:
      description: >-
        Remplacement complet du contenu d'un article : un champ absent est vidé. La révision lue est exigée ;
        une révision périmée répond 409.
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
        titre:
          $ref: "#/components/schemas/SaisieTitre"
        description:
          $ref: "#/components/schemas/SaisieDescription"
        categorieId:
          $ref: "#/components/schemas/SaisieCategorie"
        prix:
          $ref: "#/components/schemas/SaisiePrix"
        fraisDePort:
          $ref: "#/components/schemas/SaisieFraisDePort"
    Soumission:
      description: Révision lue de l'article ; une révision périmée répond 409.
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
    Motif:
      type: string
      nullable: true
      description: >-
        Catégorie du motif de la dernière issue, contrôle automatique ou décision d'un administrateur ; présente pour
        les états refuse et a_verifier, null sinon. Ne cite jamais la règle ni le seuil appliqués.
      enum:
        - annonce_incomplete
        - coordonnees_detectees
        - compte_non_autorise
        - prix_a_confirmer
        - vendeur_a_verifier
        - categorie_inconnue
        - prix_abusif
        - article_interdit
        - vendeur_non_fiable
        - null
    MotifDuControle:
      type: string
      description: Motif de l'issue a_verifier du contrôle automatique (catégories du contrat controle.resultat v1)
      enum:
        - annonce_incomplete
        - coordonnees_detectees
        - compte_non_autorise
        - prix_a_confirmer
        - vendeur_a_verifier
        - categorie_inconnue
    MotifDeRefus:
      type: string
      description: Liste fermée des motifs qu'un administrateur peut opposer à un article à vérifier
      enum:
        - annonce_incomplete
        - coordonnees_detectees
        - prix_abusif
        - article_interdit
        - vendeur_non_fiable
    Decision:
      description: >-
        Décision sur la révision examinée ; une révision périmée, ou un article qui n'est plus a_verifier, répond 409.
        motif est obligatoire pour refuser et interdit pour publier (sinon 422).
      type: object
      additionalProperties: false
      required: [revision, decision]
      properties:
        revision:
          type: integer
          minimum: 1
        decision:
          type: string
          enum: [publier, refuser]
        motif:
          $ref: "#/components/schemas/MotifDeRefus"
    ArticleAVerifier:
      type: object
      additionalProperties: false
      required: [id, revision, titre, description, categorie, prix, fraisDePort, motif, vendeurId, modifieLe]
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
          description: Révision examinée, à renvoyer dans la décision
        titre:
          type: string
          description: Texte brut, à afficher sans l'interpréter comme du HTML
        description:
          type: string
        categorie:
          allOf:
            - $ref: "#/components/schemas/Categorie"
          nullable: true
        prix:
          allOf:
            - $ref: "#/components/schemas/Montant"
          nullable: true
        fraisDePort:
          allOf:
            - $ref: "#/components/schemas/Montant"
          nullable: true
        motif:
          $ref: "#/components/schemas/MotifDuControle"
        vendeurId:
          type: string
          description: Identifiant opaque du vendeur, sans autre donnée personnelle
        modifieLe:
          type: string
          format: date-time
    PageArticlesAVerifier:
      type: object
      additionalProperties: false
      required: [elements, page, taille, total]
      properties:
        elements:
          type: array
          items:
            $ref: "#/components/schemas/ArticleAVerifier"
        page:
          type: integer
          minimum: 1
        taille:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    Categorie:
      type: object
      additionalProperties: false
      required: [id, libelle]
      properties:
        id:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        libelle:
          type: string
          minLength: 1
          maxLength: 100
    ListeCategories:
      type: object
      additionalProperties: false
      required: [elements]
      properties:
        elements:
          type: array
          items:
            $ref: "#/components/schemas/Categorie"
    Article:
      type: object
      additionalProperties: false
      required: [id, etat, revision, titre, description, categorie, prix, fraisDePort, motif, creeLe, modifieLe]
      properties:
        id:
          type: string
          format: uuid
        etat:
          type: string
          enum: [brouillon, en_controle, publie, refuse, a_verifier]
        revision:
          type: integer
          minimum: 1
        titre:
          type: string
        description:
          type: string
        categorie:
          allOf:
            - $ref: "#/components/schemas/Categorie"
          nullable: true
        prix:
          allOf:
            - $ref: "#/components/schemas/Montant"
          nullable: true
        fraisDePort:
          allOf:
            - $ref: "#/components/schemas/Montant"
          nullable: true
        motif:
          $ref: "#/components/schemas/Motif"
        creeLe:
          type: string
          format: date-time
        modifieLe:
          type: string
          format: date-time
    PageArticles:
      type: object
      additionalProperties: false
      required: [elements, page, taille, total]
      properties:
        elements:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        page:
          type: integer
          minimum: 1
        taille:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    EntreeCatalogue:
      type: object
      additionalProperties: false
      required: [id, titre, prix, categorie]
      properties:
        id:
          type: string
          format: uuid
        titre:
          type: string
        prix:
          $ref: "#/components/schemas/Montant"
        categorie:
          $ref: "#/components/schemas/Categorie"
    ArticlePublie:
      description: Fiche publique d'un article publié ; aucune donnée du vendeur n'y figure.
      type: object
      additionalProperties: false
      required: [id, titre, prix, categorie, description, fraisDePort]
      properties:
        id:
          type: string
          format: uuid
        titre:
          type: string
        prix:
          $ref: "#/components/schemas/Montant"
        categorie:
          $ref: "#/components/schemas/Categorie"
        description:
          type: string
        fraisDePort:
          description: null si le vendeur ne les a pas renseignés
          allOf:
            - $ref: "#/components/schemas/Montant"
          nullable: true
    PageCatalogue:
      type: object
      additionalProperties: false
      required: [elements, page, taille, total]
      properties:
        elements:
          type: array
          items:
            $ref: "#/components/schemas/EntreeCatalogue"
        page:
          type: integer
          minimum: 1
        taille:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    ErreurDeChamp:
      type: object
      additionalProperties: false
      required: [champ, code]
      properties:
        champ:
          type: string
          example: prix.montantCentimes
        code:
          type: string
          enum:
            - obligatoire
            - invalide
            - hors_limites
            - trop_long
            - caractere_interdit
            - negatif
            - au_dela_du_plafond
            - devise_non_prise_en_charge
            - categorie_inconnue
    Probleme:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: >-
            about:blank pour les erreurs génériques ; sinon urn:collector:probleme:saisie-invalide,
            urn:collector:probleme:corps-invalide, urn:collector:probleme:revision-perimee,
            urn:collector:probleme:article-non-modifiable, urn:collector:probleme:article-non-soumettable ou
            urn:collector:probleme:article-non-a-verifier
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        erreurs:
          type: array
          items:
            $ref: "#/components/schemas/ErreurDeChamp"
  responses:
    SaisieInvalide:
      description: Saisie invalide (erreurs par champ) ou corps invalide (JSON mal formé, clé dupliquée, champ inconnu, type inattendu)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Probleme"
    NonAuthentifie:
      description: Jeton absent, expiré, mal signé, d'un autre émetteur, d'une autre audience ou d'un autre client
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Probleme"
    NonAutorise:
      description: Jeton valide sans le rôle exigé par la route (vendeur ou admin)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Probleme"
    Introuvable:
      description: >-
        Article inexistant, appartenant à un autre vendeur (routes du vendeur) ou non publié (routes du catalogue) ;
        réponse identique dans tous les cas
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Probleme"
    Conflit:
      description: Révision périmée, ou article non modifiable ou non soumettable dans son état
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Probleme"
    ConflitDecision:
      description: >-
        Révision périmée (urn:collector:probleme:revision-perimee) ou article qui n'est plus a_verifier
        (urn:collector:probleme:article-non-a-verifier) ; la décision n'est pas appliquée
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Probleme"
    MotifInvalide:
      description: >-
        Motif absent pour refuser, présent pour publier, ou hors de la liste fermée
        (urn:collector:probleme:saisie-invalide, erreur de champ motif avec le code obligatoire ou invalide)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Probleme"
    CorpsTropVolumineux:
      description: Corps au-delà de 32 Kio
